<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的第一个网页</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="topbar">
    <div class="topbar-inner">
        <a href="home.html">我的小作品</a>
        <button id="themeBtn">深色</button>
    </div>
</nav>

<div class="wrap-narrow page-body">
    <div class="card">
        <h1 style="font-size: clamp(34px, 5vw, 48px); letter-spacing: -0.03em; margin-bottom: 8px;">你好，世界</h1>
        <p class="muted" style="margin: 0;">这是我的第一个网页 · 2026年11月</p>

        <div class="intro-list">
            <div class="intro-item">
                <div class="icon">🎲</div>
                <div>
                    <h2>猜数字游戏</h2>
                    <p>Python 写的第一个完整程序：随机数、循环、判断、输入容错。</p>
                </div>
            </div>

            <div class="intro-item">
                <div class="icon">🗂️</div>
                <div>
                    <h2>下载文件夹整理脚本</h2>
                    <p>每月 1 号和 16 号晚上 9 点自动运行，按扩展名分类文件。</p>
                </div>
            </div>

            <div class="intro-item">
                <div class="icon">📊</div>
                <div>
                    <h2>表格工具</h2>
                    <p>批量统计 Excel/CSV 结构，按关键词搜索，隐藏工作表单独归类。</p>
                </div>
            </div>
        </div>

        <div class="card-footer">
            <button id="bgBtn" class="btn-secondary">切换背景</button>
        </div>
    </div>
</div>

<script src="theme.js"></script>
<script>
    // 这个按钮和顶栏的深色按钮做同一件事，保持同步
    const bgBtn = document.querySelector("#bgBtn");
    bgBtn.addEventListener("click", function () {
        document.querySelector("#themeBtn").click();
    });
</script>
</body>
</html>
